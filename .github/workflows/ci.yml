name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # EndToEndMavenTest builds a transformed fixture offline against ~/.m2; download its dependencies first.
      - name: Warm the Maven repository for the end-to-end fixture
        run: |
          cp -r src/test/resources/fixtures/spring-layered "$RUNNER_TEMP/warm-fixture"
          mvn -B -q -f "$RUNNER_TEMP/warm-fixture/pom.xml" -DskipTests test-compile
      - name: Test
        run: mvn -B test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t archmorph:ci .
      - name: Smoke test (hardened, as in docker-compose.yml)
        run: |
          docker run -d --name archmorph -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp:size=1g,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true archmorph:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/actuator/health && exit 0
            sleep 2
          done
          docker logs archmorph
          exit 1
