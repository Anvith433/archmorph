# ===========================================================================
# ArchMorph configuration. Every archmorph.* key is documented in
# ArchMorphProperties; sizes accept units (MB), durations accept ISO-8601 (PT5M).
# ===========================================================================
spring.application.name=ArchMorph
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.persistent=false
server.tomcat.max-swallow-size=2MB

# --- Uploads (multipart limits follow the archive limit) -------------------
archmorph.upload.max-archive-size=100MB
archmorph.upload.max-uncompressed-size=500MB
archmorph.upload.max-entry-count=20000
archmorph.upload.max-single-entry-size=50MB
spring.servlet.multipart.max-file-size=${archmorph.upload.max-archive-size}
spring.servlet.multipart.max-request-size=${archmorph.upload.max-archive-size}

# --- Workspace --------------------------------------------------------------
archmorph.workspace.root=./workspace
archmorph.workspace.retention=PT24H
archmorph.workspace.cleanup-interval=PT15M

# --- Analysis and transformation limits -------------------------------------
archmorph.analysis.max-java-files=10000
archmorph.analysis.max-project-files=20000
archmorph.analysis.timeout=PT5M
archmorph.transformation.require-validation=true
archmorph.transformation.preserve-tests=true
archmorph.transformation.timeout=PT5M

# --- Module discovery weights (normalised to sum to 1 at runtime) -----------
archmorph.module-discovery.dependency-weight=0.30
archmorph.module-discovery.naming-weight=0.20
archmorph.module-discovery.package-weight=0.10
archmorph.module-discovery.entity-weight=0.20
archmorph.module-discovery.endpoint-weight=0.10
archmorph.module-discovery.type-usage-weight=0.10

# --- Build validation (sandboxed Maven; read docs/THREAT_MODEL.md first) ----
archmorph.validation.build.enabled=true
archmorph.validation.build.mode=COMPILE
archmorph.validation.build.maven-executable=mvn
archmorph.validation.build.timeout=PT4M

# --- Jobs -------------------------------------------------------------------
archmorph.jobs.worker-threads=2
archmorph.jobs.max-queued-jobs=20
archmorph.jobs.max-active-jobs-per-client=3

# --- Security ----------------------------------------------------------------
archmorph.security.allowed-origins=http://localhost:5173
archmorph.security.trust-forwarded-headers=false
archmorph.security.rate-limit.enabled=true

# --- Actuator: health only, no details ---------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
